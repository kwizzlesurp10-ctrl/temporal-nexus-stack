<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEXUS • Cyberpunk Phishing Intelligence Dashboard</title>
  
  <!-- Tailwind + DaisyUI (CDN for instant run) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@300;400;700&display=swap');

    body {
      background: #0a0a0f;
      color: #e0e7ff;
      font-family: 'Roboto Mono', monospace;
      overflow-x: hidden;
    }
    .glass {
      background: rgba(20, 20, 40, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(100, 200, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 212, 255, 0.15);
    }
    .glow-text {
      text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
    }
    .neon-border {
      border: 1px solid #00ffff;
      box-shadow: 0 0 20px #00ffff44;
    }
    .scan-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(200vh); }
    }
    .particle {
      position: absolute;
      background: #00ffff44;
      border-radius: 50%;
      pointer-events: none;
      animation: float 15s infinite linear;
    }
    @keyframes float {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
    }
  </style>
</head>
<body class="min-h-screen relative">

  <div id="root"></div>
  <div class="scan-line"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Lucide Icons Wrapper
    const Icon = ({ name, size = 24, className = "" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && lucide) lucide.createIcons(ref.current);
      }, []);
      return <i data-lucide={name} className={className} style={{width:size,height:size}} ref={ref}></i>;
    };

    const NexusApp = () => {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [sessions, setSessions] = useState([
        { id: "sess-001", victim: "j.doe@lockheedmartin.com", ip: "185.34.12.89", status: "active", tokens: true, time: "2m ago", platform: "O365" },
        { id: "sess-002", victim: "admin@saudi-aramco.co", ip: "94.45.152.11", status: "active", tokens: true, time: "8m ago", platform: "Azure" },
        { id: "sess-003", victim: "cfo@merck.com", ip: "198.51.100.44", status: "expired", tokens: false, time: "1h ago", platform: "Gmail" },
      ]);
      const [particles, setParticles] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setParticles(p => [...p.slice(-50), {
            id: Date.now(),
            x: Math.random() * window.innerWidth,
            size: Math.random() * 4 + 2,
            duration: Math.random() * 20 + 10
          }]);
        }, 300);
        return () => clearInterval(interval);
      }, []);

      const menuItems = [
        { id: "dashboard", label: "NEXUS CORE", icon: "zap" },
        { id: "sessions", label: "LIVE SESSIONS", icon: "users" },
        { id: "phishlets", label: "PHISHLET LAB", icon: "flask-conical" },
        { id: "lures", label: "AI LURES", icon: "brain-circuit" },
        { id: "c2", label: "COMMAND CENTER", icon: "radio" },
      ];

      return (
        <div className="min-h-screen relative">
          {/* Floating Particles */}
          {particles.map(p => (
            <div
              key={p.id}
              className="particle absolute rounded-full"
              style={{
                left: p.x + "px",
                width: p.size + "px",
                height: p.size + "px",
                animationDuration: p.duration + "s"
              }}
            />
          ))}

          {/* Hero Header */}
          <header className="relative z-10 border-b border-cyan-500/30 glass">
            <div className="max-w-7xl mx-auto px-6 py-8">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-6xl font-black tracking-tighter" style={{fontFamily: 'Orbitron'}}>
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-600 glow-text">
                      NEXUS
                    </span>
                  </h1>
                  <p className="text-cyan-400 mt-2 text-sm tracking-widest">PHISHING INTELLIGENCE MATRIX • v9.9.9</p>
                </div>
                <div className="flex items-center gap-6">
                  <div className="text-right">
                    <div className="text-2xl font-bold text-cyan-400">{sessions.filter(s=>s.status==="active").length}</div>
                    <div className="text-xs text-cyan-300">ACTIVE VICTIMS</div>
                  </div>
                  <div className="w-16 h-16 rounded-full bg-gradient-to-br from-cyan-500 to-purple-600 neon-border animate-pulse"></div>
                </div>
              </div>
            </div>
          </header>

          <div className="flex">
            {/* Cyberpunk Sidebar */}
            <aside className="w-80 glass h-screen fixed left-0 top-0 pt-32 px-6 border-r border-cyan-500/20">
              <nav className="space-y-3">
                {menuItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full text-left px-6 py-5 rounded-xl transition-all flex items-center gap-4
                      ${activeTab === item.id 
                        ? 'bg-cyan-500/20 neon-border text-cyan-400 shadow-2xl shadow-cyan-500/50' 
                        : 'hover:bg-white/5 hover:text-cyan-300'}`}
                  >
                    <Icon name={item.icon} size={28} />
                    <span className="text-lg font-medium tracking-wider">{item.label}</span>
                  </button>
                ))}
              </nav>

              <div className="absolute bottom-8 left-6 right-6">
                <div className="glass rounded-2xl p-6 neon-border">
                  <div className="text-cyan-400 text-xs uppercase mb-2">System Status</div>
                  <div className="space-y-2 text-sm">
                    <div className="flex justify-between"><span>Evasion Score</span><span className="text-green-400">99.8%</span></div>
                    <div className="flex justify-between"><span>Domains Active</span><span className="text-green-400">47</span></div>
                    <div className="flex justify-between"><span>Uptime</span><span className="text-green-400">127d 9h</span></div>
                  </div>
                </div>
              </div>
            </aside>

            {/* Main Content Area */}
            <main className="ml-80 p-10 min-h-screen">
              {activeTab === "dashboard" && (
                <div className="space-y-8">
                  <h2 className="text-5xl font-black glow-text" style={{fontFamily: 'Orbitron'}}>DASHBOARD</h2>
                  
                  {/* Stats Grid */}
                  <div className="grid grid-cols-4 gap-6">
                    {[
                      { label: "TOTAL SESSIONS", value: "1,847", color: "from-cyan-500 to-blue-600" },
                      { label: "TOKENS HARVESTED", value: "1,203", color: "from-purple-500 to-pink-600" },
                      { label: "CORPORATE TARGETS", value: "312", color: "from-green-500 to-emerald-600" },
                      { label: "SUCCESS RATE", value: "94.3%", color: "from-orange-500 to-red-600" },
                    ].map(stat => (
                      <div key={stat.label} className="glass rounded-2xl p-8 neon-border">
                        <div className={`text-5xl font-black bg-gradient-to-r ${stat.color} bg-clip-text text-transparent`}>
                          {stat.value}
                        </div>
                        <div className="text-cyan-300 mt-2 text-sm uppercase tracking-wider">{stat.label}</div>
                      </div>
                    ))}
                  </div>

                  {/* Live Sessions Table */}
                  <div className="glass rounded-3xl p-8 neon-border overflow-hidden">
                    <h3 className="text-3xl font-bold mb-6 text-cyan-400">LIVE VICTIM FEED</h3>
                    <div className="overflow-x-auto">
                      <table className="w-full">
                        <thead>
                          <tr className="text-cyan-400 text-left border-b border-cyan-500/30">
                            <th className="pb-4">VICTIM</th>
                            <th>IP / GEO</th>
                            <th>PLATFORM</th>
                            <th>TOKENS</th>
                            <th>TIME</th>
                            <th>ACTION</th>
                          </tr>
                        </thead>
                        <tbody>
                          {sessions.map(s => (
                            <tr key={s.id} className="border-b border-white/5 hover:bg-white/5 transition">
                              <td className="py-5 font-mono text-lg">{s.victim}</td>
                              <td className="font-mono">{s.ip}</td>
                              <td><span className="px-3 py-1 rounded-full bg-purple-500/30 text-purple-300 text-xs">{s.platform}</span></td>
                              <td>{s.tokens ? <Icon name="check-circle" className="text-green-400 inline" /> : <Icon name="x-circle" className="text-red-400 inline" />}</td>
                              <td className="text-cyan-300">{s.time}</td>
                              <td>
                                <button className="btn btn-sm bg-cyan-500/20 hover:bg-cyan-500 hover:text-black neon-border">
                                  CONTROL
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === "sessions" && (
                <div className="text-center py-20">
                  <h2 className="text-6xl font-black glow-text mb-8" style={{fontFamily: 'Orbitron'}}>LIVE SESSIONS MODULE</h2>
                  <p className="text-2xl text-cyan-300">Real-time session hijacking interface coming online...</p>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<NexusApp />);
  </script>
</body>
</html>
